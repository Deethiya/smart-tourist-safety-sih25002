<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Tourist Safety Map</title>

  <!-- Leaflet CSS (free, no API key needed) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    #dashboard {
      position: absolute;
      top: 10px;
      left: 60px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 14px;
    }
    #status {
      font-weight: bold;
      font-size: 16px;
    }
    .safe { color: green; }
    .warning { color: orange; }
    .emergency { color: red; }
  </style>
</head>
<body>

  <div id="dashboard">
    <div>Tourist Safety Dashboard</div>
    <div id="status" class="safe">Status: SAFE</div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS (free, no API key needed) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Our own code -->
  <script src="app.js"></script>

</body>
</html>
